# Shopify app config for Anytill. Fill client_id after `shopify app config link` with your Partner account.
client_id = ""
name = "Anytill"
application_url = "https://anytill.onrender.com"
embedded = true

[access_scopes]
# read the order total, mark it paid, tag it and store the settlement proof
scopes = "read_orders,write_orders"

[auth]
redirect_urls = ["https://anytill.onrender.com/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"
